      <form id="form2">
        <h3>Information</h3>
        <input type="number" placeholder="Height" required>
        <input type="number" placeholder="Weight" required>
        

        <div class="btn-box">
          <button type="button" id="back1">Back</button>
          <button type="button"id="next2">Next</button> 
        </div>
        
      </form>

      <form id="form3">
        <h3>Chronic Health Conditions</h3>
        
        <div class="select-container1">
          <select name="HighBloodPressure" id="highBp" class="select-box" required >
            <option value="" hidden disabled selected>Do you have high blood pressure?</option>
            <option value="1">Yes</option>
            <option value="3">No</option>
            <option value="4">Borderline high/Pre-hypertensive </option>
          </select>
        </div>

        <div class="select-container2">
          <select name="HadHeartAttack" id="hadHeartAttack" class="select-box" required>
            <option value="" disabled hidden selected>Are you a victim of a heart attack?</option>
            <option value="1">Yes</option>
            <option value="2">No</option>
          </select>
        </div>

        <div class="select-container3">
          <select name="Diabetis" id="anyDiabetis" class="select-box" required>
            <option value="" disabled hidden selected>Do you have Diabetes?</option>
            <option value="1">Yes</option>
            <option value="3">No</option>
            <option value="4">Pre Diabetes</option>
            <option value="999">Don't Know</option>
        </select>
        </div>
        
        

        <div class="btn-box">
          <button type="button" id="back2">Back</button>
          <button type="button" id="next3">Next</button> 
        </div>
        
      </form>

      <form id="form4">
        <h3>Chronic Health Conditions</h3>
        
        <div class="select-container1">
          <select name="HighCholLevel" id="highChl" class="select-box" required>
            <option value="" disabled hidden   selected >Do you have high Cholestrol Levels?</option>
            <option value="1">Yes</option>
            <option value="2">No</option>
        </select>
        </div>

        <div class="select-container2">
          <select name="KidneyDisease" id="kidneyDisease" required class="select-box">
            <option value="" disabled hidden selected>Did you have any kidney disease</option>
            <option value="1">Yes</option>
            <option value="2">No</option>
            <option value="999">Don't Know</option>
        </select>
        </div>

        <div class="select-container3">
          <select name="AnyHeartStroke" id="anyHeartStroke" required class="select-box">
            <option value="" disabled hidden selected>Have you been a victim of a stroke?</option>
            <option value="1">Yes</option>
            <option value="2">No</optioon>
        </select>
        </div>
        
        

        <div class="btn-box">
          <button type="button" id="back3">Back</button>
          <button type="button" id="next4">Next</button> 
        </div>
        
      </form>

      <form id="form5">
        <h3>Exercise Activity</h3>
        
        <div class="select-container1">
          <select name="exercise" id="exercise" class="select-box" required>
            <option value="" disabled hidden selected>Do you exercise?</option>
            <option value="1">Yes</option>
            <option value="2">No</option>
        </select>
        </div>

        <div class="select-container2">
          <select name="smoking" id="" required class="select-box">
            <option value="" disabled hidden selected>Have you had any past of smoking?</option>
            <option value="1" >Every Day</option>
            <option value="2">Some times</option>
            <option value="3">Former Smoker</option>
            <option value="4">Not Smoker</option>
          </select>
        </div>

        <div class="select-container3">
          <select name="Drinker" id="drinking" class="select-box" required>
            <option value="" disabled hidden selected>Do you drink?</option>
            <option value="1">Yes</option>
            <option value="2">No</option>
            <!-- <option value="2">Not want to tell</option> -->
          </select>
        </div>
        
        

        <div class="btn-box">
          <button type="button" id="back4">Back</button>
          <button type="Submit">Submit</button> 
        </div>
        
      </form>


    <div class="step-row">
      <div id="progress"></div>
        <!-- <div class="step-col"><small>Profile</small></div> -->
        <div class="step-col"><small>Information</small></div>
        <div class="step-col"><small>Data</small></div>
        <div class="step-col"><small>Data</small></div>
        <div class="step-col"><small>Exercise</small></div>

    </div>
  </div>
