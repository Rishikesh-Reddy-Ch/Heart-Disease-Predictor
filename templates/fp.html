<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forget Password</title>
  <style>
    
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .form-container {
      max-width: 400px;
      margin: 0 auto;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
    }
    .form-group input {
      width: 100%;
      padding: 8px;
      font-size: 16px;
    }
    .otp-verification {
      display: none;
    }
    .verification-box {
      display: none;
    }
    .success-message {
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="form-container">
  <form id="forgetPasswordForm">
    <div class="form-group">
      <label for="newPassword">New Password:</label>
      <input type="password" id="newPassword" name="newPassword" required>
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirm Password:</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required>
    </div>
    
    <div class="form-group">
      <button type="button" id="sendOTPButton" onclick="sendOTP()" disabled>Send OTP</button>
    </div>
    <div class="otp-verification">
      <div class="form-group">
        <label for="otp">Enter OTP:</label>
        <input type="text" id="otp" name="otp" required>
      </div>
      <div class="verification-box">
        <button type="button" onclick="verifyOTP()">Verify OTP</button>
      </div>
    </div>
  </form>
</div>

<script>
  function sendOTP() {
    
    document.querySelector('.otp-verification').style.display = 'block';
    document.querySelector('.verification-box').style.display = 'block';
  }

  function verifyOTP() {
    
    const enteredOTP = document.getElementById('otp').value;
    const expectedOTP = '1234'; 

    if (enteredOTP === expectedOTP) {
      
      document.body.innerHTML = '<div class="success-message">OTP Verified!</div>';
      setTimeout(() => window.close(), 1000); 
    } else {
      alert('Invalid OTP. Please try again.'); 
    }
  }

  
  function checkPasswords() {
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword && confirmPassword && newPassword === confirmPassword) {
      document.getElementById('sendOTPButton').removeAttribute('disabled');
    } else {
      document.getElementById('sendOTPButton').setAttribute('disabled', 'disabled');
      
    }
  }

  
  document.getElementById('newPassword').addEventListener('keyup', checkPasswords);
  document.getElementById('confirmPassword').addEventListener('keyup', checkPasswords);
</script>

</body>
</html>
