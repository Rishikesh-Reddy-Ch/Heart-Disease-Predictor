  <body>
    <nav>
      <ul class="nav-links">
        <li style="padding-left: 15px">
          <img src="../static/heart-pulse.svg" alt="Logo" class="logo-img" />
          <span class="logo-text">Medico+</span>
        </li>
        <li><a href="{{url_for('home')}}" class="nav-text">HOME</a></li>
        <li><a href="" class="nav-text">ABOUT</a></li>
        <li><a href="" class="nav-text">CONTACT</a></li>
      </ul>
      <div id="login" class="btn-login-container">
        <button class="btn-login" onclick="Loginredirect()">Logout</button>
      </div>
    </nav>
    <section>
      <div class="color"></div>
      <div class="color"></div>
      <div class="color"></div>

      <div class="box" id="container1">
        <div class="square" style="--i: 0"></div>
        <div class="square" style="--i: 1"></div>
        <div class="square" style="--i: 2"></div>
        <div class="square" style="--i: 3"></div>
        <div class="square" style="--i: 4"></div>
        <div class="container">
          <div class="form">
            <h2 class="con1">FORM</h2>
            <form method="post">
              <div class="inputBox user">
                <label>Height</label>
                <input
                  id="heightInput"
                  min="91"
                  max="244"
                  type="number"
                  name="Height"
                  placeholder="Height"
                  required
                />
              </div>
              <div class="inputBox user">
                <label>Weight</label>
                <input
                  id="weightInput"
                  min="23"
                  max="295"
                  type="number"
                  name="Weight"
                  placeholder="Weight"
                  required
                />
              </div>
              <div class="inputBox user">
                <label>Do you have high blood pressure?</label>
                <select
                  name="HighBloodPressure"
                  id="highBloodPressureInput"
                  class="select-box"
                  required
                >
                  <option value="" disabled selected>Select</option>
                  <option value="1">Yes</option>
                  <option value="3">No</option>
                  <option value="4">Borderline high/Pre-hypertensive</option>
                </select>
              </div>
              <div class="inputBox user">
                <label>Do you have Diabetes?</label>
                <select
                  name="Diabetes"
                  id="diabetesInput"
                  onclick="diabetes_click()"
                  class="select-box"
                  required
                >
                  <option value="" disabled selected>Select</option>
                  <option value="1">Yes</option>
                  <option value="3">No</option>
                  <option value="4">Pre Diabetes</option>
                  <option value="999">Don't Know</option>
                </select>
              </div>
              <div class="inputBox user">
                <label>Age when discovered diabetes?</label>
                <input
                  id="diabetesAgeInput"
                  min="1"
                  max="97"
                  type="number"
                  name="DiabetesAge"
                  style="cursor: not-allowed; filter: blur(0.63px)"
                  placeholder="Age When Told Had Diabetes"
                />
              </div>
              <div class="inputBox user">
                <label>Do you have high cholestrol levels?</label>
                <select
                  name="HighCholLevel"
                  id="highCholLevelInput"
                  class="select-box"
                  required
                >
                  <option value="" disabled selected>Select</option>
                  <option value="1">Yes</option>
                  <option value="2">No</option>
                </select>
              </div>
              <div class="inputBox user">
                <label>Do you have any kind of kidney diseases?</label>
                <select
                  name="KidneyDisease"
                  id="kidneyDiseaseInput"
                  required
                  class="select-box"
                >
                  <option value="" disabled selected>Select</option>
                  <option value="1">Yes</option>
                  <option value="2">No</option>
                  <option value="999">Don't Know</option>
                </select>
              </div>
              <div class="inputBox user">
                <label>Do you exercise regularly?</label>
                <select
                  name="exercise"
                  id="exerciseInput"
                  class="select-box"
                  required
                >
                  <option value="" disabled selected>Select</option>
                  <option value="1">Yes</option>
                  <option value="2">No</option>
                </select>
              </div>
              <div class="inputBox user">
                <label>Have you had any past of smoking?</label>
                <select
                  name="smoking"
                  id="smokingInput"
                  required
                  class="select-box"
                >
                  <option value="" disabled selected>Select</option>
                  <option value="1">Every Day</option>
                  <option value="2">Some times</option>
                  <option value="3">Former Smoker</option>
                  <option value="4">Not Smoker</option>
                </select>
              </div>
              <div class="inputBox user">
                <label>Do you have drink alcohol?</label>
                <select
                  name="Drinker"
                  id="drinkingInput"
                  class="select-box"
                  required
                >
                  <option value="" disabled selected>Select</option>
                  <option value="1">Yes</option>
                  <option value="2">No</option>
                  <!-- <option value="2">Not want to tell</option> -->
                </select>
              </div>

              <div class="inputBox">
                <input type="submit" value="submit" />
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
