<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link type="text/css" rel="stylesheet" href="../static/login.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <section class="glass">
        <h1>Login</h1>
        <form method="post">
          <div class="input-box">
            <input
              type="text"
              name="username"
              placeholder="Username"
              required
            /><i class="bx bxs-user"></i>
          </div>
          <div class="input-box">
            <input
              type="password"
              name="password"
              placeholder="Password"
              required
            /><i class="bx bxs-lock-alt"></i>
          </div>
          <div id="flash-messages" class="flash">
            {% if messages %}
            <ul>
              <script>
                "use strict";
                const ele = document.querySelector(".glass");
                const glassStyle = {
                  background: "rgba(255, 255, 255, 0.1)",
                  width: "420px",
                  height: "54vh",
                  borderRadius: "1rem",
                };
                Object.assign(ele.style, glassStyle);
              </script>
              {% for message in messages %}
              <li>{{ message }}</li>
              {% endfor %}
            </ul>
            {% endif %}
          </div>
          <div class="btn-login">
            <button type="submit" name="login">Login</button>
          </div>

          <div class="register-link">
            <p>Don't have an account? <a href="#">Register</a></p>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
