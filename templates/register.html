<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link href="../static/register.css" rel="stylesheet" />
    <script
      src="https://kit.fontawesome.com/7027708486.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section>
      <div class="color"></div>
      <div class="color"></div>
      <div class="color"></div>
      <div class="box">
        <div class="square" style="--i: 0"></div>
        <div class="square" style="--i: 1"></div>
        <div class="square" style="--i: 2"></div>
        <div class="square" style="--i: 3"></div>
        <div class="square" style="--i: 4"></div>
        <div class="container">
          <div class="form">
            <h2>Register</h2>
            <form method="post">
              <div class="inputBox user">
                <div class="i">
                  <i class="fas fa-user"></i>
                </div>

                <input
                  type="text"
                  placeholder="Username"
                  name="Username"
                  required
                />
              </div>
              <div class="inputBox user">
                <div class="i">
                  <i class="fas fa-envelope"></i>
                </div>

                <input type="email" placeholder="Email" name="email" required />
              </div>
              <div class="inputBox user">
                <div class="i">
                  <i class="fa-solid fa-calendar-day"></i>
                </div>

                <input
                  type="date"
                  style="padding-right: 20px"
                  placeholder="DOB"
                  name="dob"
                  required
                />
              </div>
              <div class="inputBox user">
                <div class="i">
                  <i class="fa-solid fa-venus-mars"></i>
                </div>
                <span class="gender">Gender:</span>
                <input
                  type="radio"
                  class="gender-input"
                  name="gender"
                  id="male"
                  value="Male"
                  required
                />
                <label class="gender-label" for="male">Male</label>
                <input
                  type="radio"
                  class="input"
                  name="gender"
                  value="Female"
                  id="female"
                  required
                />
                <label for="female" class="gender-label">Female</label>
              </div>
              <div class="inputBox">
                <div class="i">
                  <i class="fas fa-lock"></i>
                </div>
                <input type="password" placeholder="password" name="password" />
                <div class="i-eye">
                  <i
                    id="password"
                    onclick="showpassword('password')"
                    class="fa-regular fa-eye-slash eventPassword"
                  ></i>
                </div>
              </div>

              <div class="error-flash">
                {% if messages%} {{messages[-1]}} {% endif %}
              </div>
              <div class="inputBox">
                <input type="submit" value="Sign-up" />
              </div>
              <p class="login">
                Have an Account? <a href="{{url_for('login')}}">Click Here</a>
              </p>
            </form>
          </div>
        </div>
      </div>
      <script
        type="text/javascript"
        src="{{ url_for('static', filename='scripts/login_register.js') }}"
      ></script>
    </section>
  </body>
</html>
