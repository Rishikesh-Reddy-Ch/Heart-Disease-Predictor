<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link type="text/css" rel="stylesheet" href="../static/register.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <main>
        <section class="glass">
            <h1>Register</h1>
            <form method="post">
                <div class="input-box"><input type="text" name="username" placeholder="Username" required><i class='bx bxs-user'></i></div>
                <div class="input-box"><input type="password" name="password" placeholder="Password" required><i class='bx bxs-lock-alt'></i></div>
                <div class="inputBox"><input type="email" name="email" placeholder="Email" required><i class='bx 
                bx-envelope'></i></div>
                <div class="inputBox"><input type="tel" name="phoneNum" placeholder="Phone Number" required><i class='bx
                bx-phone'></i></div>
                <div class="regFlash">
                    {% if messages %}
                    <script src="scrypts/allign.js">
                    </script>
                    <ul>
                        <script>
                            "use strict";
                            const ele = document.querySelector(".glass");
                            const glassStyle = {
                              background: "rgba(255, 255, 255, 0.1)",
                              width: "600px",
                              height: "75vh",
                              borderRadius: "1rem",
                            };
                            Object.assign(ele.style, glassStyle);
                          </script>
                      {% for msg in messages %}
                      <li>{{ msg[1] }}</li>
                      {% endfor %}
                    </ul>
                    {% endif %}
                  </div>
                <div class="btn-login"><button type="submit" name="login">Register</button></div>
                
                </div>
            </form>
        </section>
    </main>
</body>
</html>
