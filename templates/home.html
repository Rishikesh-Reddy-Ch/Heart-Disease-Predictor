<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medico+</title>
    <link type="text/css" rel="stylesheet" href="../static/home.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@300&family=Montserrat:wght@300;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="color"></div>
    <div class="color"></div>
    <div class="color"></div>
    <nav>
      <ul class="nav-links">
        <li style="padding-left: 15px">
          <img src="../static/heart-pulse.svg" alt="Logo" class="logo-img" />
          <span class="logo-text">Medico+</span>
        </li>
        <li><a href="">HOME</a></li>
        <li><a href="">ABOUT</a></li>
        <li><a href="">CONTACT</a></li>
      </ul>
      <div id="login" class="btn-login-container">
        <button class="btn-login" onclick="Loginredirect()">Login</button>
      </div>
    </nav>
    <img
      src="../static/heart-problems-cardiology-diseases-banner-with-man-who-has-heart-pain_605858-1894-transformed-removebg.png"
      class="right-image"
    />

    <div class="container">
      <div class="content">
        <h1>
          CHECK YOUR <br />
          <span class="auto-type"></span>
        </h1>
        <p>
          Medico+ is a free online website to check heart health, it raises
          awareness and gives tips and how to manage the risk of heart disease
        </p>
        <button class="btn" onclick="form_redirect()">Check here</button>
      </div>
    </div>
    <script src="https://unpkg.com/typed.js@2.0.16/dist/typed.umd.js"></script>
    <script>
      var typed = new Typed(".auto-type", {
        // strings: ["heart health", "heart fitness", "cardiovascular well being"],
        strings: ["heart health", "heart fitness"],

        typeSpeed: 120,
        backSpeed: 100,
        loop: true,
      });
      if ("{{session['Username']}}") {
        document.querySelector(".btn-login").textContent = "Logout";
      }
      function Loginredirect() {
        if (document.querySelector(".btn-login").textContent == "Login") {
          window.location.href = "{{url_for('login')}}";
        } else {
          window.location.href = "{{url_for('logout')}}";
        }
      }
      function form_redirect() {
        if ("{{session['Username']}}") {
          window.location.href = "{{url_for('form')}}";
        } else {
          alert("***Please Login to continue!***");
        }
      }
    </script>
  </body>
</html>
