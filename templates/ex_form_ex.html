<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Static Template</title>
    <link type="text/css" rel="stylesheet" href="../static/form.css" />
  </head>
  <body>
    <div class="color"></div>
    <div class="color"></div>
    <div class="color"></div>
    <div class="square" style="--i: 0"></div>
    <div class="square" style="--i: 1"></div>
    <div class="square" style="--i: 2"></div>
    <div class="square" style="--i: 3"></div>
    <div class="square" style="--i: 4"></div>
    
    <form id="msform">
      <ul id="progressbar">
        <li class="active">Physical Info</li>
        <li>Health Conditions</li>
        <li>Chronic Health Conditions</li>
        <li>Physical Health</li>
      </ul>
      
      <div class="form">
        <h2 class="fs-title">Physical Parameters</h2>
        <input type="number" name="height" placeholder="Height" required />
        <input type="weight" name="weight" placeholder="Weight" required>
        <input type="button" name="next" class="next action-button" value="Next" />
      </div>
      
      <div class="form">
        <h2 class="fs-title">Health</h2>
        <select name="HighBloodPressure" id="highBloodPressureInput" class="select-box" required>
          <option value="" disabled selected required>Do you have high blood pressure?</option>
          <option value="1">Yes</option>
          <option value="3">No</option>
          <option value="4">Borderline high/Pre-hypertensive</option>
        </select>
        <select
          name="HadHeartAttack"
          id="hadHeartAttackInput"
          class="select-box"
          required
        >
          <option value="" disabled selected required>
            Are you a victim of a heart attack?
          </option>
          <option value="1">Yes</option>
          <option value="2">No</option>
        </select>
        <select name="Diabetes" id="diabetesInput" class="select-box" required>
          <option value="" selected>Do you have Diabetes?</option>
          <option value="1">Yes</option>
          <option value="3">No</option>
          <option value="4">Pre Diabetes</option>
          <option value="999">Don't Know</option>
        </select>
        <input
          id="diabetesAgeInput"
          min="1"
          max="97"
          type="number"
          style="cursor: not-allowed; filter: blur(0.63px)"
          placeholder="Age When Told Had Diabetes"
          disabled
        />
        
        <input type="button" name="previous" class="previous action-button" value="Previous" />
        <input type="button" name="next" class="next action-button" value="Next" />
      </div>
      
      <div class="form">
        <h2 class="fs-title">Chronic Health Conditions</h2>
        <!-- Chronic health condition inputs go here -->
        <select
          name="HighCholLevel"
          id="highCholLevelInput"
          class="select-box"
          required
        >
          <option value="" disabled selected required>
            Do you have high Cholestrol Levels?
          </option>
          <option value="1">Yes</option>
          <option value="2">No</option>
        </select>
        <select
          name="KidneyDisease"
          id="kidneyDiseaseInput"
          required
          class="select-box"
        >
          <option value="" disabled selected required>
            Did you have any kidney disease
          </option>
          <option value="1">Yes</option>
          <option value="2">No</option>
          <option value="999">Don't Know</option>
        </select>
        <select
          name="AnyHeartStroke"
          id="anyHeartStrokeInput"
          required
          class="select-box"
        >
          <option value="" disabled selected required>
            Have you been a victim of a stroke?
          </option>
          <option value="1">Yes</option>
          <option value="2">No</option>
        </select>
        <input type="button" name="previous" class="previous action-button" value="Previous" />
        <input type="button" name="next" class="next action-button" value="Next" />
      </div>
      
      <div class="form">
        <h2 class="fs-title">Physical Health</h2>
        <!-- Physical health inputs go here -->
        <select name="exercise" id="exerciseInput" class="select-box" required>
          <option value="" disabled selected>Do you exercise?</option>
          <option value="1">Yes</option>
          <option value="2">No</option>
        </select>
        <select name="smoking" id="smokingInput" required class="select-box" required>
          <option value="" disabled selected>
            Have you had any past of smoking?
          </option>
          <option value="1">Every Day</option>
          <option value="2">Some times</option>
          <option value="3">Former Smoker</option>
          <option value="4">Not Smoker</option>
        </select>
        <select name="Drinker" id="drinkingInput" class="select-box" required>
          <option value="" disabled selected>Do you drink Alcohol?</option>
          <option value="1">Yes</option>
          <option value="2">No</option>
          <!-- <option value="2">Not want to tell</option> -->
        </select>
        <input type="button" name="previous" class="previous action-button" value="Previous" />
        <input type="submit" name="submit" class="submit action-button" value="Submit" />
      </div>
    </form>

    <script src="https://code.jquery.com/jquery-3.5.0.min.js" integrity="sha256-xNzN2a4ltkB44Mc/Jz3pT4iU1cmeR0FkXs4pru/JxaQ=" crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.4.1/jquery.easing.min.js"></script>
    <script>
      $(function() {
        // jQuery time
        var current_fs, next_fs, previous_fs; // fieldsets
        var left, opacity, scale; // fieldset properties which we will animate
        var animating; // flag to prevent quick multi-click glitches
    
        $(".next").click(function() {
          if (animating) return false;
          animating = true;
    
          current_fs = $(this).parent();
          next_fs = $(this)
            .parent()
            .next();
    
          // activate next step on progressbar using the index of next_fs
          $("#progressbar li")
            .eq($("fieldset").index(next_fs))
            .addClass("active");
    
          // show the next fieldset
          next_fs.show();
          // hide the current fieldset with style
          current_fs.animate(
            { opacity: 0 },
            {
              step: function(now, mx) {
                // as the opacity of current_fs reduces to 0 - stored in "now"
                // 1. scale current_fs down to 80%
                scale = 1 - (1 - now) * 0.2;
                // 2. bring next_fs from the right(50%)
                left = now * 50 + "%";
                // 3. increase opacity of next_fs to 1 as it moves in
                opacity = 1 - now;
                current_fs.css({ transform: "scale(" + scale + ")" });
                next_fs.css({ left: left, opacity: opacity });
              },
              duration: 800,
              complete: function() {
                current_fs.hide();
                animating = false;
              },
              // this comes from the custom easing plugin
              easing: "easeInOutBack"
            }
          );
        });
    
        $(".previous").click(function() {
          if (animating) return false;
          animating = true;
    
          current_fs = $(this).parent();
          previous_fs = $(this)
            .parent()
            .prev();
    
          // de-activate current step on progressbar
          $("#progressbar li")
            .eq($("fieldset").index(current_fs))
            .removeClass("active");
    
          // show the previous fieldset
          previous_fs.show();
          // hide the current fieldset with style
          current_fs.animate(
            { opacity: 0 },
            {
              step: function(now, mx) {
                // as the opacity of current_fs reduces to 0 - stored in "now"
                // 1. scale previous_fs from 80% to 100%
                scale = 0.8 + (1 - now) * 0.2;
                // 2. take current_fs to the right(50%) - from 0%
                left = (1 - now) * 50 + "%";
                // 3. increase opacity of previous_fs to 1 as it moves in
                opacity = 1 - now;
                current_fs.css({ left: left });
                previous_fs.css({
                  transform: "scale(" + scale + ")",
                  opacity: opacity
                });
              },
              duration: 800,
              complete: function() {
                current_fs.hide();
                animating = false;
              },
              // this comes from the custom easing plugin
              easing: "easeInOutBack"
            }
          );
        });
    
        $(".submit").click(function() {
          return false;
        });
      });
    </script>
    
  </body>
</html>
